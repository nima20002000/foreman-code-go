name: graphql-tests
services:
  postgres:
    image: postgres:17-alpine
    # The disposable instance can be rebuilt from fixtures after a host crash. Its data lives in RAM:
    # test databases are created and dropped constantly, and that churn should not wear the SSD.
    command: ["postgres", "-c", "max_connections=300", "-c", "max_locks_per_transaction=512",
      "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    environment:
      POSTGRES_DB: graphql_test_control
      POSTGRES_USER: graphql_test_admin
      POSTGRES_PASSWORD: graphql_test_disposable_only
    ports:
      - "127.0.0.1:55439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphql_test_admin -d graphql_test_control"]
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data:size=6g
    volumes:
      - ./scripts/test-postgres-init.sql:/docker-entrypoint-initdb.d/test-ownership.sql:ro
    labels:
      graphql.test-owner: disposable-tests
