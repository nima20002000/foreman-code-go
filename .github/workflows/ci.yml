name: CI
# Main dispatches one run per CI suite or integration partition on the public mirror, where runners are free.
run-name: ci ${{ inputs.run_id }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Main's CI run id
        required: true
      ref:
        description: The mirror branch holding the commit's files
        required: true
      suite:
        description: install, typecheck, lint, unit, build, integration or a check part (scripts/ci-suite.sh)
        required: true
      slice:
        description: Unit shard i/n or integration file indexes (scripts/ci-files.mjs); empty runs them all
        required: false
        default: ''
      scope:
        description: full or affected
        required: false
        default: affected
      files:
        description: Selected repository file indexes for affected unit, lint or typecheck
        required: false
        default: ''
      default_branch:
        description: Workspace default branch comparison ref on the mirror
        required: false
        default: main
      partition:
        description: Runner-selected partition as JSON
        required: false
        default: ''
      durations:
        description: Learned file durations shared by every partition as JSON
        required: false
        default: '{}'

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 'true'
      FOREMAN_CODE_CI_DEDICATED: '1'
      SUITE: ${{ inputs.suite }}
      SLICE: ${{ inputs.slice }}
      SCOPE: ${{ inputs.scope }}
      SELECTED_FILES: ${{ inputs.files }}
      DEFAULT_BRANCH: ${{ inputs.default_branch }}
      CI_PARTITION: ${{ inputs.partition }}
      CI_DURATIONS: ${{ inputs.durations }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      # The pinned pnpm through corepack, as on our computers; Worker tests read it offline from corepack's cache.
      - run: corepack enable && corepack install
      - run: scripts/ci-suite.sh start
      # Installed packages without the pnpm store: half the size, so the restore is twice as fast.
      - id: packages
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            !node_modules/.pnpm-store
            !node_modules/.vitest-cache
            !**/node_modules/.cache
            !apps/web/node_modules/.tmp
          key: packages-${{ runner.os }}-node22.23.2-${{ hashFiles('pnpm-lock.yaml') }}
      # Only suites that build the Worker artifact read the store (its package index and native packages for other
      # platforms); it stays inside node_modules where the install recorded it.
      - id: store
        if: inputs.suite == 'integration' || inputs.suite == 'unit-other' || inputs.suite == 'unit-api' || inputs.suite == 'unit'
        uses: actions/cache@v4
        with:
          path: node_modules/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.packages.outputs.cache-hit != 'true' || (steps.store.conclusion == 'success' && steps.store.outputs.cache-hit != 'true')
        run: |
          # A store missing beside restored packages is only filled by a fresh install.
          if [ "${{ steps.packages.outputs.cache-hit }}" = true ]; then rm -rf node_modules apps/*/node_modules packages/*/node_modules; fi
          pnpm install --frozen-lockfile --store-dir node_modules/.pnpm-store
      # Emitting compilers restore output and build info together, only for identical inputs so deleted source
      # cannot leave stale compiled modules. Keeping build info in dist also invalidates it on a local cleanup.
      - name: Contracts build cache
        if: inputs.suite != 'install'
        uses: actions/cache@v4
        with:
          path: packages/contracts/dist
          key: contracts-build-${{ runner.os }}-node22.23.2-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('packages/contracts/src/**', '!packages/contracts/src/**/*.test.ts', '!packages/contracts/src/**/*.spec.ts', 'packages/contracts/tsconfig*.json', 'packages/contracts/package.json') }}
      - name: API build cache
        if: inputs.suite == 'build' || inputs.suite == 'build-api'
        uses: actions/cache@v4
        with:
          path: apps/api/dist
          key: api-build-${{ runner.os }}-node22.23.2-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/api/src/**', '!apps/api/src/**/*.test.ts', '!apps/api/src/**/__tests__/**', 'apps/api/tsconfig*.json', 'apps/api/package.json', 'packages/contracts/src/**', '!packages/contracts/src/**/*.test.ts', '!packages/contracts/src/**/*.spec.ts', 'packages/contracts/tsconfig*.json', 'packages/contracts/package.json', 'scripts/copy-api-runtime.mjs') }}
      # Both suites check the same no-emit web projects; share semantic results instead of checking them twice.
      - name: Web TypeScript cache
        if: startsWith(inputs.suite, 'typecheck') || startsWith(inputs.suite, 'build')
        uses: actions/cache@v4
        with:
          path: apps/web/node_modules/.cache/tsc
          key: web-typecheck-${{ runner.os }}-node22.23.2-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'apps/web/*.ts', 'apps/web/tsconfig*.json', 'apps/web/package.json', 'packages/contracts/src/**', 'packages/contracts/tsconfig*.json') }}
          restore-keys: web-typecheck-${{ runner.os }}-node22.23.2-${{ hashFiles('pnpm-lock.yaml') }}-
      # Publish each run's updated incremental state even when a mutable mirror ref is reused. Compiler and
      # ESLint entries validate file content. Runs start from main so every run shares main's cache scope.
      - id: suite-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules/.vitest-cache
            apps/*/node_modules/.cache
            packages/*/node_modules/.cache
            !apps/web/node_modules/.cache/tsc
          key: ci-v2-${{ runner.os }}-node22.23.2-${{ inputs.suite }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ci-v2-${{ runner.os }}-node22.23.2-${{ inputs.suite }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Suite
        run: scripts/ci-suite.sh
        env:
          DURATIONS_OUTPUT: ${{ runner.temp }}/durations.json
      - name: Save suite caches
        if: always() && steps.suite-cache.conclusion == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules/.vitest-cache
            apps/*/node_modules/.cache
            packages/*/node_modules/.cache
            !apps/web/node_modules/.cache/tsc
          key: ${{ steps.suite-cache.outputs.cache-primary-key }}
      # Each failing integration file's full test log, for diagnosis without rerunning it.
      - if: failure() && inputs.suite == 'integration'
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: .logs/test-integration/
          retention-days: 2
          if-no-files-found: ignore
      - if: always() && contains(fromJSON('["integration", "unit-api", "unit-web"]'), inputs.suite)
        uses: actions/upload-artifact@v4
        with:
          name: durations
          path: |
            ${{ runner.temp }}/durations.json
            ${{ runner.temp }}/durations.json.vitest.json
          retention-days: 1
          if-no-files-found: ignore
