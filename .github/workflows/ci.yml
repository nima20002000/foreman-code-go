name: CI
# Main dispatches one run per CI suite or integration partition on the public mirror, where runners are free.
run-name: ci ${{ inputs.run_id }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Main's CI run id
        required: true
      ref:
        description: The mirror branch holding the commit's files
        required: true
      suite:
        description: install, typecheck, lint, unit, build, integration or a check part (scripts/ci-suite.sh)
        required: true
      slice:
        description: The integration file indexes of this partition (scripts/ci-files.mjs); empty runs them all
        required: false
        default: ''

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 'true'
      FOREMAN_CODE_CI_DEDICATED: '1'
      SUITE: ${{ inputs.suite }}
      SLICE: ${{ inputs.slice }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - run: scripts/ci-suite.sh start
      # Installed packages for this lockfile; a hit skips pnpm install entirely.
      - id: packages
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            !node_modules/.vitest-cache
            !**/node_modules/.cache
            !apps/web/node_modules/.tmp
          key: packages-${{ runner.os }}-node22.23.2-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.packages.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      # Compiled test modules, ESLint and TypeScript results from earlier runs; all are keyed by file content, so a
      # stale entry only costs a recompile. Runs start from main so every run shares main's cache scope.
      - uses: actions/cache@v4
        with:
          path: |
            node_modules/.vitest-cache
            apps/*/node_modules/.cache
            apps/web/node_modules/.tmp
            packages/*/node_modules/.cache
          key: ci-${{ inputs.suite }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ inputs.ref }}
          restore-keys: ci-${{ inputs.suite }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Suite
        run: scripts/ci-suite.sh
        env:
          DURATIONS_OUTPUT: ${{ runner.temp }}/durations.json
      - if: always() && inputs.suite == 'integration'
        uses: actions/upload-artifact@v4
        with:
          name: durations
          path: ${{ runner.temp }}/durations.json
          retention-days: 1
          if-no-files-found: ignore
