name: CI
# Main dispatches one run per CI suite or integration partition on the public mirror, where runners are free.
run-name: ci ${{ inputs.run_id }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Main's CI run id
        required: true
      ref:
        description: The mirror branch holding the commit's files
        required: true
      suite:
        description: install, typecheck, lint, unit, build or integration
        required: true
      files:
        description: The integration files of this partition, space-separated; empty runs them all
        required: false
        default: ''

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 'true'
      FOREMAN_CODE_CI_DEDICATED: '1'
      SUITE: ${{ inputs.suite }}
      FILES: ${{ inputs.files }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Compiled test modules, ESLint and TypeScript results from earlier runs; all are keyed by file content, so a
      # stale entry only costs a recompile. Runs start from main so every run shares main's cache scope.
      - uses: actions/cache@v4
        with:
          path: |
            node_modules/.vitest-cache
            apps/*/node_modules/.cache
            apps/web/node_modules/.tmp
            packages/*/node_modules/.cache
          key: ci-${{ inputs.suite }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ inputs.ref }}
          restore-keys: ci-${{ inputs.suite }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Suite
        run: |
          case "$SUITE" in
            install) ;;
            unit) pnpm db:up && pnpm test ;;
            typecheck|lint|build) pnpm "$SUITE" ;;
            integration)
              pnpm db:up
              export FOREMAN_CODE_INTEGRATION_DURATIONS_OUTPUT="$RUNNER_TEMP/durations.json"
              # Native process tests need a delegated cgroup, as a systemd user service gets on our build computers.
              sudo -E env "PATH=$PATH" systemd-run --quiet --scope -p Delegate=yes --uid="$(id -u)" --gid="$(id -g)" -- \
                pnpm test:integration ${FILES:+--files $FILES} ;;
            *) echo "Unknown suite $SUITE"; exit 2 ;;
          esac
      - if: always() && inputs.suite == 'integration'
        uses: actions/upload-artifact@v4
        with:
          name: durations
          path: ${{ runner.temp }}/durations.json
          retention-days: 1
          if-no-files-found: ignore
