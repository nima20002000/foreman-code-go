name: CI
# Main dispatches one run per CI suite or integration partition on the public mirror, where runners are free.
run-name: ci ${{ inputs.run_id }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Main's CI run id
        required: true
      ref:
        description: The published snapshot commit to test
        required: true
      suite:
        description: install, typecheck, lint, unit, build, integration or a check part (scripts/ci-suite.sh)
        required: true
      slice:
        description: Unit shard i/n or integration file indexes (scripts/ci-files.mjs); empty runs them all
        required: false
        default: ''
      scope:
        description: full or affected
        required: false
        default: affected
      files:
        description: Selected repository file indexes for affected unit, lint or typecheck
        required: false
        default: ''
      default_branch:
        description: Workspace default branch comparison ref on the mirror
        required: false
        default: main
      base_commit:
        description: Optional sanitized ancestor SHA for affected selection on the mirror
        required: false
        default: ''
      partition:
        description: Runner-selected partition as JSON
        required: false
        default: ''
      expected_duration_ms:
        description: Expected duration of this CI part in milliseconds
        required: false
        default: '0'
      gate:
        description: Gate identity for integration execution
        required: false
        default: '0'
      durations:
        description: Learned file durations shared by every partition as JSON
        required: false
        default: '{}'

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: 'true'
      # The runner is a full systemd VM; the suite probes a delegated user service before integration.
      CI_USER_SYSTEMD: '1'
      FOREMAN_CODE_CI_DEDICATED: '1'
      FOREMAN_CODE_CI_CONTRACTS_CACHE: .logs/ci-contracts-cache
      FOREMAN_CODE_CI_GO_CACHE: .logs/ci-go-cache
      FOREMAN_CODE_CI_POSTGRES_CACHE: .logs/ci-postgres-cache
      CI_STATE: .logs/ci-state
      CGO_ENABLED: '1'
      SUITE: ${{ inputs.suite }}
      SLICE: ${{ inputs.slice }}
      SCOPE: ${{ inputs.scope }}
      SELECTED_FILES: ${{ inputs.files }}
      DEFAULT_BRANCH: ${{ inputs.default_branch }}
      BASE_COMMIT: ${{ inputs.base_commit }}
      CI_PARTITION: ${{ inputs.partition }}
      CI_EXPECTED_DURATION_MS: ${{ inputs.expected_duration_ms }}
      FOREMAN_CODE_CI_GATE: ${{ inputs.gate }}
      CI_DURATIONS: ${{ inputs.durations }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: ${{ inputs.base_commit != '' && 2 || 1 }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      # The pinned pnpm through corepack, as on our computers; Worker tests read it offline from corepack's cache.
      - run: |
          umask 077
          mkdir -p .logs
          corepack enable && corepack install
      - name: Go native prerequisites
        run: |
          GO_SUITE="$(node scripts/ci-cloud-native-prerequisites.mjs)"
          printf 'GO_SUITE=%s\n' "$GO_SUITE" >> "$GITHUB_ENV"
          if [ "$GO_SUITE" = true ]; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends build-essential pkg-config libvips-dev
            node scripts/ci-go-prerequisites.mjs native
          fi
      - name: PostgreSQL source-build and conformance prerequisites
        if: inputs.suite == 'integration'
        run: |
          # Only this disposable cloud VM installs packages. Build computers use existing tools.
          sudo apt-get install --yes --no-install-recommends perl git openssl iproute2
      - id: cache-inputs
        run: |
          echo "packages=$(node scripts/ci-packages.mjs key "$PWD")" >> "$GITHUB_OUTPUT"
          if [ "$SUITE" != install ]; then
            echo "contracts=$(node scripts/ci-contracts.mjs key "$PWD")" >> "$GITHUB_OUTPUT"
          fi
          if [ "$GO_SUITE" = true ]; then
            echo "go=$(node scripts/ci-go-prerequisites.mjs cache-key)" >> "$GITHUB_OUTPUT"
          fi
          if [ "$SUITE" = integration ]; then
            echo "postgres=$(bash scripts/ci-postgres-toolchain.sh cache-key)" >> "$GITHUB_OUTPUT"
          fi
          # A stable per-shard key, so each shard's warm cache is reused by the same shard of later runs.
          echo "shard=$(printf '%s|%s' "$SLICE" "$CI_PARTITION" | sha1sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - name: Go toolchain cache
        if: env.GO_SUITE == 'true'
        uses: actions/cache@v4
        with:
          path: .logs/ci-go-cache/toolchains
          key: go-toolchain-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci-go-versions.json') }}
      - name: Staticcheck cache
        if: contains(fromJSON('["lint","lint-api"]'), inputs.suite)
        uses: actions/cache@v4
        with:
          path: .logs/ci-go-cache/tools
          key: go-staticcheck-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci-go-versions.json') }}
      - name: PostgreSQL toolchain cache
        if: inputs.suite == 'integration'
        uses: actions/cache@v4
        with:
          path: .logs/ci-postgres-cache/toolchains
          key: postgres-toolchain-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-inputs.outputs.postgres }}
      - id: go-cache
        if: env.GO_SUITE == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            .logs/ci-go-cache/modules
            .logs/ci-go-cache/build
          key: go-artifacts-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-inputs.outputs.go }}-${{ inputs.ref }}
          restore-keys: go-artifacts-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-inputs.outputs.go }}-
      - run: scripts/ci-suite.sh start
      # Installed packages without the pnpm store: half the size, so the restore is twice as fast.
      - id: packages
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            conformance/node_modules
            backend/bridge/claude/node_modules
            !node_modules/.pnpm-store
            !node_modules/.vitest-cache
            !**/node_modules/.cache
            !apps/web/node_modules/.tmp
          key: packages-v2-${{ runner.os }}-${{ steps.cache-inputs.outputs.packages }}
      # Metadata and store are needed only when installed packages must be populated.
      - id: metadata
        if: steps.packages.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: .logs/pnpm-metadata
          key: pnpm-metadata-v2-${{ runner.os }}-${{ steps.cache-inputs.outputs.packages }}
      # A complete packages hit needs no store; a miss restores it so the offline install can fill packages.
      - id: store
        if: steps.packages.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: node_modules/.pnpm-store
          key: pnpm-store-v2-${{ runner.os }}-${{ steps.cache-inputs.outputs.packages }}
      - name: Install from cached store
        run: node scripts/ci-packages.mjs install "$PWD"
        env:
          CI_PNPM_STORE_CACHE_HIT: ${{ steps.store.outputs.cache-hit }}
      # Emitting compilers restore output and build info together, only for identical inputs so deleted source
      # cannot leave stale compiled modules. Keeping build info in dist also invalidates it on a local cleanup.
      - name: Contracts build cache
        if: inputs.suite != 'install'
        uses: actions/cache@v4
        with:
          path: packages/contracts/dist
          key: contracts-build-${{ runner.os }}-${{ steps.cache-inputs.outputs.contracts }}
      # Both suites check the same no-emit web projects; share semantic results instead of checking them twice.
      - name: Web TypeScript cache
        if: (startsWith(inputs.suite, 'typecheck') || startsWith(inputs.suite, 'build')) && inputs.suite != 'typecheck-api' && inputs.suite != 'build-api'
        uses: actions/cache@v4
        with:
          path: apps/web/node_modules/.cache/tsc
          key: web-typecheck-${{ runner.os }}-node22.23.2-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'apps/web/*.ts', 'apps/web/tsconfig*.json', 'apps/web/package.json', 'packages/contracts/src/**', 'packages/contracts/tsconfig*.json') }}
          restore-keys: web-typecheck-${{ runner.os }}-node22.23.2-${{ hashFiles('pnpm-lock.yaml') }}-
      # Publish each run's updated incremental state even when a mutable mirror ref is reused. Compiler and
      # ESLint entries validate file content. Runs start from main so every run shares main's cache scope.
      - id: suite-cache
        if: inputs.suite != 'install'
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules/.vitest-cache
            apps/*/node_modules/.cache
            packages/*/node_modules/.cache
            conformance/node_modules/.cache
            backend/bridge/claude/node_modules/.cache
            !apps/web/node_modules/.cache/tsc
          key: ci-v2-${{ runner.os }}-node22.23.2-${{ inputs.suite }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ steps.cache-inputs.outputs.shard }}
          restore-keys: ci-v2-${{ runner.os }}-node22.23.2-${{ inputs.suite }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Suite
        # The output is also kept as an artifact, so Main settles the result without downloading the provider log.
        shell: bash
        run: |
          chmod go-w .logs
          scripts/ci-suite.sh 2>&1 | tee "${{ runner.temp }}/suite.log"
        env:
          DURATIONS_OUTPUT: ${{ runner.temp }}/durations.json
          TEST_RESULTS_OUTPUT: ${{ runner.temp }}/test-results.json
          CI_WATCHDOG_MESSAGE_FILE: ${{ runner.temp }}/watchdog-message.json
      - name: Remove disposable CI resources
        if: always()
        run: bash scripts/ci-suite.sh cleanup
      - name: Save Go module and build caches
        if: always() && steps.go-cache.conclusion == 'success' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .logs/ci-go-cache/modules
            .logs/ci-go-cache/build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
      - name: Save suite caches
        if: always() && steps.suite-cache.conclusion == 'success' && steps.suite-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules/.vitest-cache
            apps/*/node_modules/.cache
            packages/*/node_modules/.cache
            conformance/node_modules/.cache
            backend/bridge/claude/node_modules/.cache
            !apps/web/node_modules/.cache/tsc
          key: ${{ steps.suite-cache.outputs.cache-primary-key }}
      # Each failing integration file's full test log, for diagnosis without rerunning it.
      - if: failure() && inputs.suite == 'integration'
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: .logs/test-integration/
          retention-days: 2
          if-no-files-found: ignore
      # Reports, inventory, verdicts and execution logs contain no private runtime or database state.
      - if: always() && inputs.suite == 'integration'
        uses: actions/upload-artifact@v4
        with:
          name: conformance-results
          path: .logs/ci-state/conformance/
          retention-days: 2
          if-no-files-found: ignore
      # Keep native Go evidence separately from the wrapper and normalized provider summary.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-results
          path: .logs/ci-state/go/
          retention-days: 2
          if-no-files-found: ignore
      # Measured durations and structured test results, which Main reads back with the ticket.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: durations
          path: |
            ${{ runner.temp }}/durations.json
            ${{ runner.temp }}/durations.json.vitest.json
            ${{ runner.temp }}/test-results.json
            ${{ runner.temp }}/watchdog-message.json
            ${{ runner.temp }}/suite.log
          retention-days: 1
          if-no-files-found: ignore
