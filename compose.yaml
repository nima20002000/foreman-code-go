services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: graphql
      POSTGRES_USER: graphql
      POSTGRES_PASSWORD: graphql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphql -d graphql"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - graphql-postgres-data:/var/lib/postgresql/data

volumes:
  graphql-postgres-data:
